[package]
name = "pfengine"
version = "1.0.0"
edition = "2021"
description = "PixelForge Studio core engine - layers, brushes, selections, filters, adjustments, IO"
license = "MIT"

[lib]
name = "pfengine"
crate-type = ["cdylib", "staticlib"]

[dependencies]
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
resvg = "0.45"
psd = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
